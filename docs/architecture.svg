<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MedSigLIP dual-encoder and supervised transfer-learning architecture</title>
  <desc id="desc">Medical images and clinical prompts are encoded into a shared embedding space for zero-shot classification. The image encoder also feeds a supervised classification head.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/></marker>
    <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.h{font-size:34px;font-weight:700}.s{font-size:18px;fill:#cbd5e1}.b{fill:#172033;stroke:#60a5fa;stroke-width:2}.g{fill:#123524;stroke:#4ade80;stroke-width:2}.o{fill:#3b2413;stroke:#fb923c;stroke-width:2}.l{stroke:#93c5fd;stroke-width:3;fill:none;marker-end:url(#arrow)}.bt{font-size:21px;font-weight:650;text-anchor:middle;dominant-baseline:middle}</style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="640" y="55" class="t h" text-anchor="middle">MedSigLIP: zero-shot and supervised transfer learning</text>
  <text x="640" y="88" class="t s" text-anchor="middle">Two 400M-parameter encoders • shared medical image–text embedding space • 448×448 input</text>
  <rect x="55" y="155" width="210" height="78" rx="16" class="b"/><text x="160" y="194" class="t bt">Medical image</text>
  <rect x="55" y="380" width="210" height="78" rx="16" class="g"/><text x="160" y="419" class="t bt">Clinical prompts</text>
  <rect x="350" y="145" width="250" height="98" rx="18" class="b"/><text x="475" y="184" class="t bt">Image encoder</text><text x="475" y="214" class="t s" text-anchor="middle">Vision Transformer</text>
  <rect x="350" y="370" width="250" height="98" rx="18" class="g"/><text x="475" y="409" class="t bt">Text encoder</text><text x="475" y="439" class="t s" text-anchor="middle">Text Transformer</text>
  <rect x="685" y="240" width="245" height="105" rx="18" class="b"/><text x="807" y="278" class="t bt">Shared embeddings</text><text x="807" y="311" class="t s" text-anchor="middle">cosine similarity</text>
  <rect x="1010" y="240" width="215" height="105" rx="18" class="g"/><text x="1117" y="278" class="t bt">Zero-shot scores</text><text x="1117" y="311" class="t s" text-anchor="middle">paired prompts</text>
  <rect x="685" y="500" width="245" height="105" rx="18" class="o"/><text x="807" y="538" class="t bt">Classification head</text><text x="807" y="571" class="t s" text-anchor="middle">linear probe / fine-tune</text>
  <rect x="1010" y="500" width="215" height="105" rx="18" class="o"/><text x="1117" y="538" class="t bt">Test evaluation</text><text x="1117" y="571" class="t s" text-anchor="middle">AUC • sensitivity</text>
  <path d="M265 194 H350" class="l"/><path d="M265 419 H350" class="l"/>
  <path d="M600 194 C650 194 650 270 685 270" class="l"/><path d="M600 419 C650 419 650 320 685 320" class="l"/>
  <path d="M930 292 H1010" class="l"/>
  <path d="M475 243 V550 H685" class="l"/>
  <path d="M930 552 H1010" class="l"/>
  <text x="640" y="680" class="t s" text-anchor="middle">Research and educational use only • validation thresholds are selected without test-set tuning</text>
</svg>
